# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║                                                                               ║
# ║                    DeliveryCore - Teslimat Tanımları                          ║
# ║                                                                               ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════════════════════════
# KATEGORİ VE EŞYA SEÇİMİ
# ═══════════════════════════════════════════════════════════════════════════════
#
#   category:
#     mode: random              → Rastgele kategori seç
#     mode: fixed               → Sabit kategori kullan
#       value: block            → Kategori adı (categories.yml'den)
#
#   item:
#     mode: random              → Kategoriden rastgele eşya seç
#     mode: fixed               → Sabit eşya kullan
#       value: DIAMOND          → Eşya adı
#     mode: all                 → Seçilen kategorideki bütün eşyaları kabul et
#
#   accepted-items: [WHEAT, CARROT, "custom:crop", "itemsadder:farm:tomato", "nexo:pear", "oraxen:corn"]
#     Bu liste kullanıldığında item seçiminin yerine geçer. Her eşya aynı toplamı artırır.
#     Özel eşyayı kaydederken kullandığınız adı custom: ön ekiyle yazın.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ZAMANLAMA
# ═══════════════════════════════════════════════════════════════════════════════
#
#   schedule:
#     start: "every day 20:00"      → Her gün 20:00'da başla
#     end: "every day 21:00"        → Her gün 21:00'da bitir
#
#   Bir kerelik etkinlik için start ve end alanlarına tam tarih yazın.
#   Desteklenen biçimler: "23/11/2026 20:00:00" veya "2026-11-23T20:00:00".
#   Tam tarihli start ile end: "1h" yazılırsa etkinlik her saat yenilenir.
#   İsteğe bağlı repeat: "3h", başlangıçlar arasında üç saat bırakır.
#   Süre birimleri: s (saniye), m (dakika), h (saat), d (gün), w (hafta).
#
# ═══════════════════════════════════════════════════════════════════════════════
# WEBHOOK
# ═══════════════════════════════════════════════════════════════════════════════
#
#   webhook:
#     enabled: true/false       → Bu teslimat için webhook aktif mi?
#     url: ""                   → Özel URL (boş bırakırsan config.yml'deki kullanılır)
#
#   NOT: Webhook ayarları (embed, renkler, format) config.yml'den alınır.
#        Burada sadece aktif/pasif ve opsiyonel özel URL belirtilir.
#
# ═══════════════════════════════════════════════════════════════════════════════

deliveries:

  # ┌─────────────────────────────────────────────────────────────────────────────┐
  # │  GÜNLÜK TESLİMAT                                                            │
  # └─────────────────────────────────────────────────────────────────────────────┘
  
  gunluk:
    enabled: true
    display-name: "Günlük Teslimat"
    visible-before-start: true
    
    category:
      mode: random
    item:
      mode: random
    
    timezone: Europe/Istanbul
    
    schedule:
      start: "every day 20:00"
      end: "every day 21:00"
    
    sellable:
      enabled: true
      tax-rate: 0.0
    
    end-commands:
      enabled: false 
      commands:
        - "cc give {player} vote 1"

    rewards:
      1:
        type: both
        item: DIAMOND
        amount: 10
        commands:
          - "eco give {player} 5000"
          - "broadcast &6&l1. &e{player} &7günlük teslimatı kazandı!"
      2:
        type: both
        item: DIAMOND
        amount: 5
        commands:
          - "eco give {player} 2500"
      3:
        type: item
        item: DIAMOND
        amount: 3
      4-10:
        type: command
        commands:
          - "eco give {player} 500"
      default:
        type: command
        commands:
          - "eco give {player} 100"
    
    # Webhook - config.yml'deki ayarları kullanır
    webhook:
      enabled: true
      url: ""  # Boş = config.yml'deki global URL

